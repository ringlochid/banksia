name: macOS compatibility

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: macos-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        runs-on: macos-26
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install backend dependencies
              run: make backend-install

            - name: Run macOS compatibility regressions
              run: |
                  PYTHONPATH=src ./.venv/bin/pytest \
                    tests/unit/platform/test_private_paths.py \
                    tests/unit/test_package_entrypoints.py::test_pyproject_installs_sqlalchemy_asyncio_support

            - name: Exercise real macOS initialization
              shell: bash
              run: |
                  probe_dir="$(mktemp -d "${RUNNER_TEMP}/oms-macos.XXXXXX")"
                  mkdir -p "$probe_dir/workspace"

                  XDG_CONFIG_HOME="$probe_dir/config" \
                  XDG_DATA_HOME="$probe_dir/data" \
                  XDG_STATE_HOME="$probe_dir/state" \
                  XDG_CACHE_HOME="$probe_dir/cache" \
                  ./.venv/bin/oms init \
                    --non-interactive \
                    --config "$probe_dir/config/oh-my-subagents/config.toml" \
                    --data-dir "$probe_dir/data/oh-my-subagents" \
                    --workspace "$probe_dir/workspace" \
                    --json

                  XDG_CONFIG_HOME="$probe_dir/config" \
                  XDG_DATA_HOME="$probe_dir/data" \
                  XDG_STATE_HOME="$probe_dir/state" \
                  XDG_CACHE_HOME="$probe_dir/cache" \
                  ./.venv/bin/oms config show \
                    --config "$probe_dir/config/oh-my-subagents/config.toml" \
                    --json

            - name: Exercise real macOS background-service lifecycle
              shell: bash
              run: |
                  set -euo pipefail
                  probe_dir="$(mktemp -d "${RUNNER_TEMP}/oms-macos-service.XXXXXX")"
                  home="$probe_dir/home"
                  config="$probe_dir/config/oh-my-subagents/config.toml"
                  mkdir -p "$home" "$probe_dir/workspace"

                  run_oms() {
                    HOME="$home" \
                    XDG_CONFIG_HOME="$probe_dir/config" \
                    XDG_DATA_HOME="$probe_dir/data" \
                    XDG_STATE_HOME="$probe_dir/state" \
                    XDG_CACHE_HOME="$probe_dir/cache" \
                    ./.venv/bin/oms "$@"
                  }
                  cleanup() {
                    run_oms service uninstall --config "$config" --json >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  run_oms init \
                    --non-interactive \
                    --config "$config" \
                    --data-dir "$probe_dir/data/oh-my-subagents" \
                    --workspace "$probe_dir/workspace" \
                    --json > "$probe_dir/init.json"
                  run_oms service install --config "$config" --json > "$probe_dir/install.json"
                  run_oms service status --config "$config" --json > "$probe_dir/status.json"
                  run_oms service start --config "$config" --json > "$probe_dir/start.json"
                  run_oms service restart --config "$config" --json > "$probe_dir/restart.json"
                  run_oms service logs --lines 20 --json > "$probe_dir/logs.json"
                  run_oms service stop --config "$config" --json > "$probe_dir/stop.json"
                  run_oms service uninstall --config "$config" --json > "$probe_dir/uninstall.json"

                  python - "$probe_dir" <<'PY'
                  import json
                  import sys
                  from pathlib import Path

                  root = Path(sys.argv[1])

                  def read(name: str) -> dict[str, object]:
                      with root.joinpath(f"{name}.json").open(encoding="utf-8") as stream:
                          return json.load(stream)

                  lifecycle = {name: read(name) for name in ("install", "status", "start", "restart")}
                  logs = read("logs")
                  if any(value.get("manager") != "launchd-user" for value in lifecycle.values()):
                      raise SystemExit(f"unexpected launchd manager payload: {lifecycle}")
                  if any(value.get("definition_current") is not True for value in lifecycle.values()):
                      raise SystemExit(f"LaunchAgent definition did not round-trip: {lifecycle}")
                  if any(value.get("controller_state") != "ready" for value in lifecycle.values()):
                      raise SystemExit(
                          f"LaunchAgent did not become ready: {lifecycle}; controller logs: {logs}"
                      )
                  if read("stop").get("controller_state") != "stopped":
                      raise SystemExit("LaunchAgent did not stop")
                  if read("uninstall").get("installation_state") != "absent":
                      raise SystemExit("LaunchAgent definition was not removed")
                  if not logs.get("lines"):
                      raise SystemExit("LaunchAgent controller log remained empty")
                  PY
