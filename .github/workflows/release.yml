name: Publish release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 60

        steps:
            - name: Check out tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22.22.0"
                  cache: npm
                  cache-dependency-path: console/package-lock.json

            - name: Require the tag to match the package version
              if: github.event_name == 'push'
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  python - <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
                  expected = f"v{metadata['project']['version']}"
                  actual = os.environ["RELEASE_TAG"]
                  if actual != expected:
                      raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
                  PY

            - name: Install dependencies
              run: |
                  make backend-install
                  npm --prefix console ci

            - name: Build and verify the installed distribution
              run: make package-verify

            - name: Upload verified distributions
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: python-distributions
                  path: |
                      dist/*.whl
                      dist/*.tar.gz
                  if-no-files-found: error
                  retention-days: 14

    publish:
        if: github.event_name == 'push'
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment:
            name: pypi
            url: https://pypi.org/p/oh-my-subagents
        permissions:
            id-token: write

        steps:
            - name: Download verified distributions
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: python-distributions
                  path: dist

            - name: Publish distributions to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
              with:
                  packages-dir: dist/
