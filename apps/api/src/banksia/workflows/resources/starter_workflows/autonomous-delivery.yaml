kind: workflow
id: autonomous-delivery
description: >-
  Use for a substantial delivery that benefits from explicit intent analysis,
  planning, execution, and independent verification under one accountable lead.
note: >-
  This team keeps intent, approach, delivery, and verification as distinct
  responsibilities. The lead chooses how to combine their contributions from
  the actual task and evidence rather than following a fixed phase machine.
lead:
  id: lead
  title: Delivery lead
  description: Owns the complete outcome and resolves cross-team tradeoffs.
  instruction: >-
    Maintain the full objective, constraints, and acceptance boundary. Reconcile
    the team's contributions into a coherent result and retain responsibility
    for consequential decisions and verification.
  children:
    - id: intent-analysis
      title: Intent analyst
      description: Clarifies the requested outcome, constraints, and ambiguity.
      instruction: >-
        Analyze the request and available context. Surface consequential
        ambiguity, explicit constraints, non-goals, and a testable outcome.
    - id: delivery-planning
      title: Delivery planner
      description: Develops a practical approach and identifies delivery risk.
      instruction: >-
        Propose a bounded approach grounded in the available evidence. Identify
        dependencies, failure modes, verification needs, and important
        alternatives without turning the proposal into an authored schedule.
    - id: delivery
      title: Delivery member
      description: Produces the requested change or deliverable.
      instruction: >-
        Carry out the assigned delivery scope, preserve stated constraints, and
        leave a coherent result that can be inspected and integrated.
    - id: verification
      title: Independent verifier
      description: Tests whether the integrated result satisfies the objective.
      instruction: >-
        Verify the result independently using evidence appropriate to the task.
        Report defects, unsupported claims, regressions, and material residual
        risk precisely.
