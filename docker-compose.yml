name: oms

services:
    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: oms
            POSTGRES_PASSWORD: oms
            POSTGRES_DB: oms
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U oms -d oms"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - oms-postgres:/var/lib/postgresql/data
            - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro

    postgres-test:
        image: postgres:16
        environment:
            POSTGRES_USER: oms
            POSTGRES_PASSWORD: oms
            POSTGRES_DB: oms
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U oms -d postgres"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - oms-postgres-test:/var/lib/postgresql/data
            - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro

    backend-test:
        init: true
        build:
            context: .
            dockerfile: infra/testing/backend/Dockerfile
        depends_on:
            postgres-test:
                condition: service_healthy
        environment:
            OMS_ENV: test
            OMS_DEBUG: "false"
            OMS_TEST_POSTGRES_URL: postgresql+asyncpg://oms:oms@postgres-test:5432/oms_test
        command:
            - sh
            - -c
            - OMS_DATABASE_URL="$$OMS_TEST_POSTGRES_URL" python -m oh_my_subagents db upgrade && exec python -m scripts.testing.run_backend_pytest_groups integration

volumes:
    oms-postgres:
    oms-postgres-test:
