name: banksia

services:
    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: banksia
            POSTGRES_PASSWORD: banksia
            POSTGRES_DB: banksia
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U banksia -d banksia"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - banksia-postgres:/var/lib/postgresql/data
            - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro

    postgres-test:
        image: postgres:16
        environment:
            POSTGRES_USER: banksia
            POSTGRES_PASSWORD: banksia
            POSTGRES_DB: banksia
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U banksia -d postgres"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - banksia-postgres-test:/var/lib/postgresql/data
            - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro

    backend-test:
        build:
            context: .
            dockerfile: infra/testing/backend/Dockerfile
        depends_on:
            postgres-test:
                condition: service_healthy
        environment:
            BANKSIA_ENV: test
            BANKSIA_DEBUG: "false"
            BANKSIA_TEST_POSTGRES_URL: postgresql+asyncpg://banksia:banksia@postgres-test:5432/banksia_test
        command:
            - sh
            - -c
            - BANKSIA_DATABASE_URL="$$BANKSIA_TEST_POSTGRES_URL" python -m banksia db upgrade && exec python -m scripts.testing.run_backend_pytest_groups integration

volumes:
    banksia-postgres:
    banksia-postgres-test:
