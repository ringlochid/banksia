kind: workflow
id: debug-and-verify
description: >-
  Use for an intermittent or poorly understood defect that needs reliable
  reproduction, competing hypotheses, a cause-based repair, and independent proof.
note: >-
  Keep observations, hypotheses, correction claims, and verification claims
  separate. A plausible patch is not enough unless the evidence supports the
  claimed cause and the original symptom no longer reproduces.
lead:
  id: debug-lead
  title: Debug lead
  description: Owns the failure statement, cause judgment, repair scope, and result.
  instruction: >-
    Maintain one precise account of the observed failure and compare competing
    explanations against evidence. Authorize only a cause-supported correction
    and state the confidence and limits of the final diagnosis.
  children:
    - id: investigation-manager
      title: Investigation manager
      description: Reconciles reproduction evidence and competing causes.
      instruction: >-
        Keep reproduction work independent from hypothesis challenge, compare
        their observations, and identify the smallest evidence-supported failure
        mechanism without editing product code.
      children:
        - id: reproducer
          title: Reproducer
          description: Establishes the smallest reliable failure reproduction.
          instruction: >-
            Reproduce the reported symptom with the minimum relevant setup.
            Record exact environment, inputs, observations, frequency, and
            boundaries where the failure does not occur.
        - id: hypothesis-challenger
          title: Hypothesis challenger
          description: Tests alternative causes and disconfirming evidence.
          instruction: >-
            Challenge the leading explanation with competing hypotheses and
            targeted observations. Report evidence that distinguishes causes
            instead of repeating the reproduction work.
    - id: repair-owner
      title: Repair owner
      description: Implements the evidence-supported correction.
      instruction: >-
        Correct only the supported failure mechanism and add focused regression
        proof. Identify any gap between the investigation claim and the behavior
        the code can safely guarantee.
    - id: independent-verifier
      title: Independent verifier
      description: Tests symptom resolution, adjacent behavior, and the cause claim.
      instruction: >-
        Reproduce the original case against the integrated repair, exercise
        relevant adjacent regressions, and test whether the claimed cause follows
        from observed evidence rather than the repair owner's explanation.
