kind: workflow
id: experiment-and-replication-program
description: >-
  Use for a substantial computational, data, benchmark, model, or empirical
  program that needs explicit methods, durable execution, independent
  replication, analysis, and defensible claims.
note: >-
  Establish the accepted method before interpreting outcomes. Preserve
  independence between execution and replication, use bounded item work for
  parameter or dataset cases, and reopen the method when observations invalidate it.
lead:
  id: study-lead
  title: Study lead
  description: Owns the question, accepted method, interpretation, and result.
  instruction: >-
    Maintain the research and evidence boundary. Decide how deviations and
    replication affect validity, reconcile analysis and audit, and state
    conclusions with confidence and limitations supported by observations.
  capabilities:
    human_request:
      - input
      - direction
      - review
  children:
    - id: methods-owner
      title: Methods owner
      description: Defines measurements, controls, comparisons, and stopping conditions.
      instruction: >-
        Specify observable variables, controls, comparison rules, confounders,
        stopping conditions, and required environment or data details before
        outcomes are interpreted. Identify threats that could invalidate the study.
    - id: experiment-manager
      title: Experiment manager
      description: Coordinates primary execution and independent replication.
      instruction: >-
        Keep the accepted method visible to both lanes, preserve their
        independence, record meaningful deviations, and reconcile divergent
        observations without allowing one lane to silently repair the other.
      children:
        - id: execution-owner
          title: Execution owner
          description: Performs the accepted primary study and preserves observable materials.
          instruction: >-
            Carry out the accepted method and retain relevant scripts, data,
            environment facts, failures, and results at their natural locations.
            Report every material deviation.
          capabilities:
            command_run: allow
        - id: replication-owner
          title: Replication owner
          description: Independently reconstructs or repeats the study.
          instruction: >-
            Recreate the method from available materials and report agreement,
            divergence, missing information, and sensitivity to environment or
            interpretation without silently correcting the primary execution.
          capabilities:
            command_run: allow
    - id: analysis-owner
      title: Analysis owner
      description: Interprets complete observations using the accepted method.
      instruction: >-
        Analyze positive, negative, and failed results consistently. Quantify
        uncertainty where justified, distinguish exploratory from confirmatory
        findings, and expose sensitivity to assumptions or excluded data.
    - id: claim-auditor
      title: Claim auditor
      description: Tests whether conclusions exceed method, data, or replication.
      instruction: >-
        Challenge the interpretation against sampling, confounders, failures,
        negative results, replication evidence, and alternative explanations.
        Narrow or reject claims whose support is incomplete.
