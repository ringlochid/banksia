kind: workflow
id: reproducible-study
description: >-
  Use for a computational, data, benchmark, or empirical study that needs an
  explicit method, execution, independent replication, and defensible claims.
note: >-
  Preserve the independence of execution and replication. Keep the accepted
  method distinct from observed deviations, and limit conclusions to the data,
  conditions, and reproducibility evidence actually obtained.
lead:
  id: study-lead
  title: Study lead
  description: Owns the question, accepted method, interpretation, and result.
  instruction: >-
    Maintain the research and evidence boundary, decide how deviations affect
    validity, reconcile execution and replication, and state conclusions with
    confidence and limitations supported by the observations.
  children:
    - id: methods-owner
      title: Methods owner
      description: Defines measurements, comparisons, confounders, and reproducibility needs.
      instruction: >-
        Specify observable variables, controls, comparisons, stopping
        conditions, and required environment or data details before interpreting
        outcomes. Identify threats that could invalidate the study.
    - id: study-manager
      title: Study manager
      description: Coordinates execution and replication while preserving independence.
      instruction: >-
        Keep the accepted method visible to both study lanes, record meaningful
        deviations, and reconcile divergent observations without allowing one
        lane to silently repair the other's result.
      children:
        - id: execution-owner
          title: Execution owner
          description: Performs the accepted study and preserves its observable materials.
          instruction: >-
            Carry out the accepted method and retain relevant scripts, data,
            environment facts, failures, and results at their natural project
            locations. Report every material deviation from the method.
        - id: replication-owner
          title: Replication owner
          description: Independently reconstructs or repeats the study.
          instruction: >-
            Recreate the accepted method from the available materials and report
            agreements, divergence, missing information, and sensitivity to
            environment or interpretation without silently correcting the first run.
    - id: claim-auditor
      title: Claim auditor
      description: Tests whether conclusions exceed method, data, or replication.
      instruction: >-
        Challenge the proposed interpretation against sampling, confounders,
        failures, negative results, and reproducibility evidence. Narrow or
        reject claims whose support is incomplete.
