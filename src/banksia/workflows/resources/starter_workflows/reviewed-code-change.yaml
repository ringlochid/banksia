kind: workflow
id: reviewed-code-change
description: >-
  Use for a bounded code change that needs focused implementation, independent
  review, and accountable repair before completion.
note: >-
  Keep implementation ownership separate from independent review. The change
  lead decides which findings require correction and which residual risks
  remain acceptable for the commissioned scope.
lead:
  id: change-lead
  title: Change lead
  description: Owns scope, finding disposition, integration, and the final result.
  instruction: >-
    Preserve the requested outcome and accepted constraints. Reconcile the
    implemented change, focused proof, and independent findings into one
    decision, including any material limitation that remains.
  children:
    - id: implementation-manager
      title: Implementation manager
      description: Owns production and proof changes plus accepted repairs.
      instruction: >-
        Divide the accepted scope between production behavior and focused proof,
        integrate both contributions, and turn accepted review findings into
        bounded corrections without widening the change.
      children:
        - id: code-owner
          title: Code owner
          description: Owns the bounded production-code change.
          instruction: >-
            Implement the assigned production behavior while preserving
            unrelated work and compatibility constraints. Surface code facts
            that make the accepted scope unsafe or incomplete.
        - id: test-owner
          title: Test owner
          description: Owns focused behavior and regression proof.
          instruction: >-
            Derive proof from the requested behavior and its meaningful failure
            boundaries. Prefer consequential regression coverage over assertions
            that merely mirror implementation structure.
    - id: independent-reviewer
      title: Independent reviewer
      description: Challenges the integrated change without editing it.
      instruction: >-
        Inspect the current integrated state against the original objective and
        constraints. Rank concrete correctness, compatibility, architecture,
        and proof gaps by consequence, and recheck accepted repairs when asked.
